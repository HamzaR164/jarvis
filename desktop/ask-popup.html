<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ask Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070d; --panel:#0a111f; --panel-2:#0d1728;
    --line:rgba(34,211,238,0.16); --cyan:#22d3ee; --cyan-soft:rgba(34,211,238,0.4);
    --text:#e8f1fa; --muted:#5b7290;
    --font-d:'JetBrains Mono',monospace; --font-b:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--void);color:var(--text);font-family:var(--font-b);display:flex;flex-direction:column;overflow:hidden;}
  .head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);-webkit-app-region:drag;}
  .head .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .head span{font-family:var(--font-d);font-size:11px;letter-spacing:2px;color:var(--cyan);}
  .selection{margin:10px 14px 0;padding:8px 10px;background:rgba(34,211,238,0.06);border:1px solid var(--line);
    border-radius:8px;font-size:11.5px;color:var(--muted);max-height:60px;overflow-y:auto;}
  .msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
  .msg{font-size:13px;line-height:1.5;padding:8px 11px;border-radius:10px;max-width:92%;}
  .msg.user{align-self:flex-end;background:rgba(91,140,255,0.16);border:1px solid rgba(91,140,255,0.25);}
  .msg.jarvis{align-self:flex-start;background:rgba(34,211,238,0.07);border:1px solid var(--line);}
  .row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);}
  .row input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:16px;
    padding:8px 12px;color:var(--text);font-size:12.5px;outline:none;font-family:var(--font-b);}
  .row button{background:var(--cyan);color:#00212b;border:none;border-radius:16px;padding:0 14px;font-size:12px;font-weight:600;cursor:pointer;}
  .thinking{font-size:11px;color:var(--muted);padding:0 14px 8px;font-family:var(--font-d);letter-spacing:1px;}
</style>
</head>
<body>
  <div class="head"><div class="dot"></div><span>ASK JARVIS</span></div>
  <div class="selection" id="selection">No text captured — copy something and try again.</div>
  <div class="msgs" id="msgs"></div>
  <div class="thinking" id="thinkingLine" style="display:none;">thinking…</div>
  <div class="row">
    <input id="input" placeholder="Ask a follow-up…">
    <button id="send">Send</button>
  </div>

<script>
function renderMsg(who, text){
  const c = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}
function setThinking(on){
  document.getElementById('thinkingLine').style.display = on ? 'block' : 'none';
}

async function ask(text){
  renderMsg('user', text);
  setThinking(true);
  const res = await window.jarvis.ask(text);
  setThinking(false);
  if (res.error){ renderMsg('jarvis', 'Hiccup: ' + res.error); return; }
  renderMsg('jarvis', res.replyText);
  if (res.audioDataUrl){
    try{ new Audio(res.audioDataUrl).play(); }catch(e){}
  }
}

document.getElementById('send').addEventListener('click', () => {
  const inp = document.getElementById('input');
  const v = inp.value.trim();
  if (!v) return;
  inp.value = '';
  ask(v);
});
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('send').click();
});

window.jarvis.onPopupSelectedText((text) => {
  const sel = document.getElementById('selection');
  if (text && text.trim()){
    sel.textContent = text.length > 400 ? text.slice(0,400) + '…' : text;
    ask('Here is some selected text — help with it or explain it as seems most useful: ' + text);
  } else {
    sel.textContent = 'No text captured — copy something and try again.';
  }
});
</script>
</body>
</html>
