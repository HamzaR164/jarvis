<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070d; --panel-2:#0d1728;
    --line:rgba(34,211,238,0.16); --cyan:#22d3ee; --cyan-soft:rgba(34,211,238,0.4);
    --text:#e8f1fa; --muted:#5b7290; --danger:#f87171;
    --font-d:'JetBrains Mono',monospace; --font-b:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at 50% 40%, #0b1730 0%, var(--void) 65%), var(--void);
    color:var(--text);font-family:var(--font-b);overflow:hidden;position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 3px);
    pointer-events:none;z-index:0;
  }
  .drag-region{position:fixed;top:0;left:0;right:0;height:28px;-webkit-app-region:drag;z-index:2;}

  #app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}

  .avatar-wrap{position:relative;width:260px;height:260px;cursor:pointer;transition:transform .3s ease;}
  .avatar-wrap:hover{transform:scale(1.02);}
  .avatar-svg{width:100%;height:100%;overflow:visible;}
  .ring-tick{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:1 7.4;}
  .ring-outer{fill:none;stroke:var(--cyan-soft);stroke-width:1;opacity:.6;animation:spin 90s linear infinite;transform-origin:100px 100px;}
  .ring-arc{fill:none;stroke:var(--cyan);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:70 300;
    opacity:.85;animation:spin 6s linear infinite;transform-origin:100px 100px;filter:drop-shadow(0 0 4px var(--cyan));}
  .avatar-wrap[data-state="idle"] .ring-arc{animation-duration:14s;opacity:.5;}
  .avatar-wrap[data-state="listening"] .ring-arc{animation-duration:3.2s;stroke:#7dfcff;opacity:1;}
  .avatar-wrap[data-state="thinking"] .ring-arc{animation-duration:1.8s;opacity:1;}
  .avatar-wrap[data-state="speaking"] .ring-arc{animation-duration:.9s;stroke:#a7ffef;opacity:1;}
  .avatar-wrap[data-state="recording"] .ring-arc{animation-duration:1.2s;stroke:var(--danger);opacity:1;}
  .ring-core{fill:var(--panel-2);stroke:var(--cyan-soft);stroke-width:1;}
  .core-glow{position:absolute;inset:46px;border-radius:50%;background:radial-gradient(circle, rgba(34,211,238,0.18) 0%, transparent 70%);animation:pulse 3.4s ease-in-out infinite;}
  .avatar-wrap[data-state="listening"] .core-glow{animation-duration:1.4s;}
  .avatar-wrap[data-state="speaking"] .core-glow{animation-duration:.8s;}
  .avatar-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;}
  .avatar-title{font-family:var(--font-d);font-size:22px;letter-spacing:3px;}
  .avatar-state{font-family:var(--font-d);font-size:9px;letter-spacing:2px;color:var(--cyan);opacity:.8;text-transform:uppercase;}
  .particle{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cyan);opacity:.7;animation:float 5s ease-in-out infinite;pointer-events:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
  @keyframes float{0%,100%{transform:translate(0,0);opacity:.3;}50%{transform:translate(4px,-8px);opacity:.9;}}

  .widgets{display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .35s ease, transform .35s ease, max-height .35s ease;max-height:220px;opacity:1;}
  .widgets.hidden{opacity:0;transform:translateY(14px);max-height:0;pointer-events:none;}
  .clock{font-family:var(--font-d);font-size:52px;font-weight:700;letter-spacing:2px;line-height:1;text-shadow:0 0 18px var(--cyan-soft);}
  .date{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .weather{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:13px;color:var(--muted);margin-top:4px;}
  .weather b{color:var(--text);font-size:16px;}
  .stats{font-family:var(--font-d);font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-top:2px;}

  .hint{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:2px;transition:opacity .3s;}
  .widgets.hidden ~ .hint{opacity:0;}

  .caption{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);max-width:min(560px,86vw);
    text-align:center;font-size:13.5px;line-height:1.5;color:var(--text);background:rgba(10,17,31,0.7);
    border:1px solid var(--line);border-radius:14px;padding:10px 18px;opacity:0;transition:opacity .3s;pointer-events:none;}
  .caption.show{opacity:1;}

  .school{position:fixed;inset:0;background:var(--void);display:none;flex-direction:column;z-index:5;}
  body.school-active .school{display:flex;}
  body.school-active #app{display:none;}
  .school-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;-webkit-app-region:drag;}
  .school-head span:first-child{font-family:var(--font-d);font-size:10px;letter-spacing:2px;color:var(--muted);}
  .school-hint{font-size:9.5px;color:var(--muted);}
  .school-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .school-msgs .msg{font-size:12.5px;line-height:1.5;}
  .school-msgs .msg.user{color:var(--text);}
  .school-msgs .msg.user::before{content:'you — ';color:var(--muted);}
  .school-msgs .msg.jarvis{color:#c8dae8;}
  .school-msgs .msg.jarvis::before{content:'jarvis — ';color:var(--cyan);font-family:var(--font-b);font-size:11px;}
  .school-input{display:flex;gap:6px;padding:12px;border-top:1px solid var(--line);}
  .school-input input{flex:1;background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:6px;
    padding:8px 10px;color:var(--text);font-size:12.5px;outline:none;font-family:var(--font-b);}
  .school-input button{background:rgba(34,211,238,0.14);border:1px solid var(--cyan-soft);color:var(--cyan);border-radius:6px;padding:0 12px;cursor:pointer;font-size:12px;}

  @media (prefers-reduced-motion:reduce){.ring-outer,.ring-arc,.particle,.core-glow{animation:none !important;}}
</style>
</head>
<body>
<div class="drag-region"></div>
<div id="app">
  <div class="avatar-wrap" id="avatar" data-state="idle">
    <div class="core-glow"></div>
    <svg class="avatar-svg" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" class="ring-tick"/>
      <circle cx="100" cy="100" r="80" class="ring-outer"/>
      <circle cx="100" cy="100" r="80" class="ring-arc"/>
      <circle cx="100" cy="100" r="58" class="ring-core"/>
    </svg>
    <div class="avatar-label"><span class="avatar-title">JARVIS</span><span class="avatar-state" id="avatarState">say "Jarvis" to talk</span></div>
    <div class="particle" style="top:10%;left:20%;animation-delay:0s;"></div>
    <div class="particle" style="top:70%;left:8%;animation-delay:1.2s;"></div>
    <div class="particle" style="top:20%;left:85%;animation-delay:2.4s;"></div>
    <div class="particle" style="top:85%;left:75%;animation-delay:.6s;"></div>
  </div>

  <div class="widgets" id="widgets">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="dateLine">loading date</div>
    <div class="weather" id="weatherLine"><b id="weatherTemp">--°</b><span id="weatherSub">loading weather</span></div>
    <div class="stats" id="statsLine">CPU --% · RAM --GB</div>
  </div>
  <div class="hint">say "Jarvis" — or click the ring</div>
</div>

<div class="school" id="schoolPanel">
  <div class="school-head"><span>SCHOOL MODE</span><span class="school-hint">Ctrl+Enter to exit</span></div>
  <div class="school-msgs" id="schoolMsgs"></div>
  <div class="school-input">
    <input id="schoolInput" placeholder="Ask something…">
    <button id="schoolSend">Go</button>
  </div>
</div>

<div class="caption" id="caption"></div>

<script>
function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB');
  document.getElementById('dateLine').textContent = now.toLocaleDateString('en-US',{weekday:'long',day:'2-digit',month:'long'});
}
tick(); setInterval(tick,1000);

const WMO = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Heavy snow',80:'Showers',95:'Storm'};
async function loadWeather(){
  const w = await window.jarvis.weather();
  if (w.error){ document.getElementById('weatherSub').textContent = 'weather unavailable'; return; }
  document.getElementById('weatherTemp').textContent = w.temp + '°C';
  document.getElementById('weatherSub').textContent = w.label + ' · ' + (WMO[w.code]||'—') + ' · H' + w.hi + '° L' + w.lo + '°';
}
loadWeather(); setInterval(loadWeather, 15*60*1000);

async function loadStats(){
  try{
    const s = await window.jarvis.systemStats();
    if (s.error) return;
    document.getElementById('statsLine').textContent = `CPU ${s.cpuPct}% · RAM ${s.usedMemGB}/${s.totalMemGB}GB`;
  }catch(e){}
}
loadStats(); setInterval(loadStats, 5000);

(async () => {
  const ok = await window.jarvis.hasConfig();
  if (!ok) caption('config.json missing — copy config.example.json, add your API keys, then restart');
})();

function setAvatarState(state, label){
  document.getElementById('avatar').dataset.state = state;
  document.getElementById('avatarState').textContent = label || state;
  try{ window.jarvis.notifyState(state); }catch(e){}
}
function caption(text){
  const c = document.getElementById('caption');
  c.textContent = text; c.classList.add('show');
  clearTimeout(c._h); c._h = setTimeout(()=>c.classList.remove('show'), 7000);
}

function renderSchoolMsg(who, text){
  const c = document.getElementById('schoolMsgs');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}
async function askSchool(text){
  renderSchoolMsg('user', text);
  const res = await window.jarvis.ask(text, { speak: false });
  if (res.error){ renderSchoolMsg('jarvis', 'Hiccup: ' + res.error); return; }
  renderSchoolMsg('jarvis', res.replyText);
}
document.getElementById('schoolSend').addEventListener('click', () => {
  const inp = document.getElementById('schoolInput');
  const v = inp.value.trim(); if (!v) return;
  inp.value = ''; askSchool(v);
});
document.getElementById('schoolInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('schoolSend').click();
});
window.jarvis.onSchoolModeChanged((isOn) => {
  document.body.classList.toggle('school-active', isOn);
  if (isOn) document.getElementById('schoolInput').focus();
  if (isOn && typeof endConversation === 'function') endConversation();
});
function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i=0;i<bytes.length;i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}

let conversing = false;
let currentAudio = null;
let requireWakeWord = true;

let micStream = null, vadAnalyser = null, vadData = null;
let voiceFrames = 0, silenceFrames = 0;
const VAD_THRESHOLD = 22;
const VAD_SUSTAIN_FRAMES = 8;
const SILENCE_SUSTAIN_FRAMES = 45;
const MIN_UTTERANCE_MS = 500;

let utteranceRecorder = null, utteranceChunks = [], isRecordingUtterance = false, utteranceStartTime = 0;

async function initMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(micStream);
    vadAnalyser = ctx.createAnalyser();
    vadAnalyser.fftSize = 512;
    source.connect(vadAnalyser);
    vadData = new Uint8Array(vadAnalyser.frequencyBinCount);
    requestAnimationFrame(vadLoop);
  }catch(e){
    caption('Mic permission needed — check your OS microphone permission for Jarvis, then reopen');
  }
}

function vadLoop(){
  if (vadAnalyser){
    vadAnalyser.getByteTimeDomainData(vadData);
    let sum = 0;
    for (let i=0;i<vadData.length;i++){ sum += Math.abs(vadData[i]-128); }
    const avg = sum / vadData.length;

    if (!conversing){
      if (avg > VAD_THRESHOLD){
        voiceFrames++;
        if (voiceFrames > VAD_SUSTAIN_FRAMES){ voiceFrames = 0; startConversation(); }
      } else { voiceFrames = 0; }
    } else if (isRecordingUtterance){
      if (avg > VAD_THRESHOLD){
        silenceFrames = 0;
      } else {
        silenceFrames++;
        const elapsed = Date.now() - utteranceStartTime;
        if (silenceFrames > SILENCE_SUSTAIN_FRAMES && elapsed > MIN_UTTERANCE_MS){
          stopUtteranceRecording();
        }
      }
    }
  }
  requestAnimationFrame(vadLoop);
}
initMic();

function startConversation(){
  conversing = true;
  requireWakeWord = true;
  document.getElementById('widgets').classList.add('hidden');
  startUtteranceRecording();
}
function endConversation(){
  conversing = false;
  document.getElementById('widgets').classList.remove('hidden');
  if (isRecordingUtterance && utteranceRecorder && utteranceRecorder.state === 'recording'){
    isRecordingUtterance = false;
    try{ utteranceRecorder.onstop = null; utteranceRecorder.stop(); }catch(e){}
  }
  if (currentAudio){ try{ currentAudio.pause(); }catch(e){} }
  setAvatarState('idle', 'say "Jarvis" to talk');
  document.getElementById('caption').classList.remove('show');
}
document.getElementById('avatar').addEventListener('click', () => {
  if (conversing){ endConversation(); }
  else { requireWakeWord = false; startConversation(); }
});

function startUtteranceRecording(){
  if (!micStream){ caption('Microphone not ready — check OS mic permission'); endConversation(); return; }
  setAvatarState('listening');
  utteranceChunks = [];
  silenceFrames = 0;
  utteranceStartTime = Date.now();
  try{
    utteranceRecorder = new MediaRecorder(micStream, { mimeType: 'audio/webm' });
  }catch(e){
    caption('Recording not supported here: ' + (e.message || e));
    endConversation();
    return;
  }
  isRecordingUtterance = true;
  utteranceRecorder.ondataavailable = (e) => { if (e.data.size > 0) utteranceChunks.push(e.data); };
  utteranceRecorder.onstop = onUtteranceStopped;
  utteranceRecorder.start();
}

function stopUtteranceRecording(){
  isRecordingUtterance = false;
  if (utteranceRecorder && utteranceRecorder.state === 'recording'){
    utteranceRecorder.stop();
  }
}

async function onUtteranceStopped(){
  if (!conversing) return;
  if (!utteranceChunks.length){ startUtteranceRecording(); return; }
  setAvatarState('thinking');
  try{
    const blob = new Blob(utteranceChunks, { type: 'audio/webm' });
    const buf = await blob.arrayBuffer();
    const base64 = arrayBufferToBase64(buf);
    const t = await window.jarvis.transcribe(base64);
    if (!conversing) return;
    if (!t.ok){
      caption('Transcription hiccup: ' + t.error);
      startUtteranceRecording();
      return;
    }
    if (!t.text){
      startUtteranceRecording();
      return;
    }
    if (requireWakeWord && !t.text.toLowerCase().includes('jarvis')){
      endConversation();
      return;
    }
    requireWakeWord = false;
    caption('You: ' + t.text);
    handleTurn(t.text);
  }catch(e){
    caption('Hiccup: ' + (e.message || e));
    if (conversing) startUtteranceRecording();
  }
}

async function handleTurn(text){
  setAvatarState('thinking');
  const res = await window.jarvis.ask(text);
  if (!conversing) return;
  if (res.error){
    caption('Hiccup: ' + res.error);
    startUtteranceRecording();
    return;
  }
  caption('Jarvis: ' + res.replyText);
  if (res.audioDataUrl){
    setAvatarState('speaking');
    currentAudio = new Audio(res.audioDataUrl);
    currentAudio.onended = () => { if (conversing) startUtteranceRecording(); };
    currentAudio.onerror = () => { if (conversing) startUtteranceRecording(); };
    currentAudio.play().catch(()=>{ if (conversing) startUtteranceRecording(); });
  } else if (conversing){
    startUtteranceRecording();
  }
}

let mediaRecorder = null, recordedChunks = [], recordingStream = null;

window.jarvis.onStartRecording(async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording'){ caption('Already recording'); return; }
  try{
    const src = await window.jarvis.getScreenSource();
    if (!src.ok){ caption('Could not get a screen source: ' + src.error); return; }
    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        mandatory: {
          chromeMediaSource: 'desktop',
          chromeMediaSourceId: src.sourceId,
          minWidth: 1280, maxWidth: 1920, minHeight: 720, maxHeight: 1080
        }
      }
    });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(recordingStream, { mimeType: 'video/webm;codecs=vp9' });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const buf = await blob.arrayBuffer();
      const base64 = arrayBufferToBase64(buf);
      const res = await window.jarvis.saveRecording(base64);
      caption(res.ok ? `Recording saved: ${res.path}` : `Recording failed to save: ${res.error}`);
      if (recordingStream) recordingStream.getTracks().forEach(t => t.stop());
      if (document.getElementById('avatar').dataset.state === 'recording') setAvatarState('idle', conversing ? 'listening' : 'say "Jarvis" to talk');
    };
    mediaRecorder.start();
    setAvatarState('recording');
    caption('Recording started');
  }catch(e){
    caption('Could not start recording (on Mac, check System Settings > Privacy > Screen Recording): ' + (e.message || e));
  }
});

window.jarvis.onStopRecording(() => {
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
  } else {
    caption('No recording in progress');
  }
});
</script>
</body>
</html>
